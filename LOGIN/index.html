<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Epic Games Login</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #1a1a2e, #0b0b0f);
    color: white;
}

/* LOGIN */
#login {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: #151521;
    padding: 25px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 0 20px rgba(43, 47, 255, 0.4);
    text-align: center;
}

.card h2 {
    margin-bottom: 15px;
}

input {
    width: 90%;
    padding: 10px;
    margin: 6px 0;
    border: none;
    border-radius: 6px;
    outline: none;
}

button {
    width: 95%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    background: #2b2fff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1a1cff;
}

.msg {
    margin-top: 10px;
    font-size: 14px;
}

.error { color: #ff4d4d; }
.success { color: #00ff88; }

/* HOME */
#home {
    display: none;
    padding: 20px;
    text-align: center;
}

.hero {
    max-width: 700px;
    margin: auto;
    background: #151521;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(43, 47, 255, 0.3);
}

.hero img {
    width: 100%;
    max-width: 400px;
    border-radius: 10px;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    .card {
        width: 90%;
    }

    .hero {
        width: 90%;
    }

    iframe {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <div class="card">
        <h2>Epic Games Login</h2>

        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">

        <button onclick="login()">Entrar</button>
        <button onclick="cadastro()">Cadastrar</button>

        <div id="mensagem" class="msg"></div>
    </div>
</div>

<!-- HOME -->
<div id="home">
    <div class="hero">

        <h1>Epic Games</h1>

        <p>
            A Epic Games é uma empresa global de jogos responsável por
            títulos como Fortnite e pela Unreal Engine.
        </p>

        <img src="https://cdn2.unrealengine.com/epic-games-logo-1400x788-4b3c9a7c8d4b.jpg">

        <h3>Vídeo oficial</h3>

        <iframe height="220"
            src="https://www.youtube.com/embed/2gUtfBmw86Y"
            allowfullscreen>
        </iframe>

        <p>
            <a href="https://www.epicgames.com" target="_blank">
                Acessar site oficial
            </a>
        </p>

        <button onclick="logout()">Sair</button>
    </div>
</div>

<script>
let userCadastrado = "professor";
let senhaCadastrada = "1234";

function login() {
    let usuario = document.getElementById("usuario").value;
    let senha = document.getElementById("senha").value;
    let msg = document.getElementById("mensagem");

    if (usuario === userCadastrado && senha === senhaCadastrada) {
        msg.innerHTML = "<span class='success'>Login realizado com sucesso!</span>";
        document.getElementById("login").style.display = "none";
        document.getElementById("home").style.display = "block";
    } else {
        msg.innerHTML = "<span class='error'>Usuário ou senha inválidos!</span>";
    }
}

function cadastro() {
    let usuario = document.getElementById("usuario").value;
    let senha = document.getElementById("senha").value;
    let msg = document.getElementById("mensagem");

    if (usuario && senha) {
        userCadastrado = usuario;
        senhaCadastrada = senha;
        msg.innerHTML = "<span class='success'>Cadastro realizado com sucesso!</span>";
    } else {
        msg.innerHTML = "<span class='error'>Preencha todos os campos!</span>";
    }
}

function logout() {
    document.getElementById("home").style.display = "none";
    document.getElementById("login").style.display = "flex";
}
</script>

</body>
</html>
