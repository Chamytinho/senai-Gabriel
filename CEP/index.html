<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Formulário Personalizado</title>
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Cadastro de Usuário
            </h2>

            <form>

                <!-- Nome -->
                <div class="mb-3">
                    <label class="form-label">
                        Nome Completo
                    </label>

                    <input 
                        type="text" 
                        class="form-control"
                        placeholder="Digite seu nome">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input 
                        type="email" 
                        class="form-control"
                        placeholder="Digite seu email">
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <label class="form-label">
                        Senha
                    </label>

                    <input 
                        type="password" 
                        class="form-control"
                        placeholder="Digite sua senha">
                </div>

                <!-- Data -->
                <div class="mb-3">
                    <label class="form-label">
                        Data de Nascimento
                    </label>

                    <input 
                        type="date" 
                        class="form-control">
                </div>

                <!-- CEP -->
                <div class="mb-3">
                    <label class="form-label">
                        CEP
                    </label>

                    <div class="input-group">

                        <input 
                            type="text" 
                            id="myInput"
                            class="form-control"
                            placeholder="Digite o CEP">

                        <button 
                            type="button"
                            onclick="buscarCEP()"
                            class="btn btn-primary">

                            Buscar
                        </button>

                    </div>
                </div>

                <!-- Resultado CEP -->
                <div 
                    id="myDiv" 
                    class="alert alert-secondary">
                    Dados do endereço aparecerão aqui
                </div>

                <!-- Select -->
                <div class="mb-3">
                    <label class="form-label">
                        Estado Civil
                    </label>

                    <select class="form-select">

                        <option>Solteiro</option>
                        <option>Casado</option>
                        <option>Divorciado</option>

                    </select>
                </div>

                <!-- Radio -->
                <div class="mb-3">

                    <label class="form-label d-block">
                        Sexo
                    </label>

                    <div class="form-check form-check-inline">

                        <input 
                            class="form-check-input" 
                            type="radio" 
                            name="sexo">

                        <label class="form-check-label">
                            Masculino
                        </label>

                    </div>

                    <div class="form-check form-check-inline">

                        <input 
                            class="form-check-input" 
                            type="radio" 
                            name="sexo">

                        <label class="form-check-label">
                            Feminino
                        </label>

                    </div>

                </div>

                <!-- Checkbox -->
                <div class="mb-3 form-check">

                    <input 
                        type="checkbox" 
                        class="form-check-input">

                    <label class="form-check-label">
                        Aceito os termos
                    </label>

                </div>

                <!-- Range -->
                <div class="mb-3">

                    <label class="form-label">
                        Nível de Satisfação
                    </label>

                    <input 
                        type="range" 
                        class="form-range">

                </div>

                <!-- Cor -->
                <div class="mb-3">

                    <label class="form-label">
                        Cor Favorita
                    </label>

                    <input 
                        type="color" 
                        class="form-control form-control-color">

                </div>

                <!-- Arquivo -->
                <div class="mb-3">

                    <label class="form-label">
                        Foto de Perfil
                    </label>

                    <input 
                        type="file" 
                        class="form-control">

                </div>

                <!-- Textarea -->
                <div class="mb-3">

                    <label class="form-label">
                        Observações
                    </label>

                    <textarea 
                        class="form-control"
                        rows="4">
                    </textarea>

                </div>

                <!-- Botões -->
                <div class="d-flex gap-2">

                    <button 
                        type="submit"
                        class="btn btn-success">

                        Salvar
                    </button>

                    <button 
                        type="reset"
                        class="btn btn-danger">

                        Limpar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script>

        async function buscarCEP() {

            let cep = document
                .getElementById("myInput")
                .value

            let div = document
                .getElementById("myDiv")

            cep = cep.replace(/\D/g, '')

            if (cep.length !== 8) {

                div.innerHTML = "CEP inválido"
                return
            }

            try {

                const response = await fetch(
                    `https://viacep.com.br/ws/${cep}/json/`
                )

                const data = await response.json()

                if (data.erro) {

                    div.innerHTML = "CEP não encontrado"
                    return
                }

                div.innerHTML = `
                    <strong>CEP:</strong> ${data.cep}<br>
                    <strong>Rua:</strong> ${data.logradouro}<br>
                    <strong>Bairro:</strong> ${data.bairro}<br>
                    <strong>Cidade:</strong> ${data.localidade}<br>
                    <strong>Estado:</strong> ${data.uf}
                `

            } catch (error) {

                div.innerHTML = "Erro ao buscar CEP"

                console.error(error)
            }
        }

    </script>

</body>
</html>
