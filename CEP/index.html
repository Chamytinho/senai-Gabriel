<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Buscar CEP</title>

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card-custom {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .card-header h2 {
            margin: 0;
            font-weight: bold;
        }

        .btn-custom {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            border: none;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.03);
            opacity: 0.95;
        }

        #resultado {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }

        .info {
            margin-bottom: 8px;
        }

        .icon {
            font-size: 50px;
        }
    </style>
</head>

<body>

    <div class="card card-custom">

        <div class="card-header">
            <div class="icon">📍</div>
            <h2>Consulta de CEP</h2>
            <p class="mb-0">Busque endereços rapidamente</p>
        </div>

        <div class="card-body p-4">

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Digite o CEP
                </label>

                <input 
                    type="text"
                    id="myInput"
                    class="form-control form-control-lg"
                    placeholder="Ex: 01001000"
                >
            </div>

            <button 
                onclick="myFunction()"
                class="btn btn-custom btn-lg text-white w-100"
            >
                Buscar CEP
            </button>

            <div id="resultado">

                <h5 class="mb-3 text-primary">
                    Endereço Encontrado
                </h5>

                <div class="info">
                    <strong>CEP:</strong>
                    <span id="cep"></span>
                </div>

                <div class="info">
                    <strong>Logradouro:</strong>
                    <span id="logradouro"></span>
                </div>

                <div class="info">
                    <strong>Bairro:</strong>
                    <span id="bairro"></span>
                </div>

                <div class="info">
                    <strong>Cidade:</strong>
                    <span id="cidade"></span>
                </div>

                <div class="info">
                    <strong>Estado:</strong>
                    <span id="estado"></span>
                </div>

            </div>

        </div>

    </div>

    <script>

        async function myFunction() {

            let cep = document.getElementById("myInput").value
            let resultado = document.getElementById("resultado")

            cep = cep.replace(/\D/g, "")

            if (cep.length !== 8) {
                alert("Digite um CEP válido com 8 números.")
                return
            }

            try {

                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`)
                const data = await response.json()

                if (data.erro) {
                    alert("CEP não encontrado!")
                    return
                }

                document.getElementById("cep").innerText = data.cep
                document.getElementById("logradouro").innerText = data.logradouro
                document.getElementById("bairro").innerText = data.bairro
                document.getElementById("cidade").innerText = data.localidade
                document.getElementById("estado").innerText = data.uf

                resultado.style.display = "block"

            } catch (error) {

                alert("Erro ao buscar o CEP.")

            }
        }

    </script>

</body>
</html>
